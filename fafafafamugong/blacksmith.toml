[continue]
type = 'shortcut'
description = 'Finish the interrupted reply.'
prompt = '''
Your previous reply was cut off. Continue from exactly where it stopped. Do not repeat what you already wrote, and do not add a preamble.
'''

[find]
type = 'shortcut'
description = 'Find the parts of this conversation that match a description.'
prompt = '''
Search this conversation for the passages that match what the user describes in this message, and quote them.
For each match, say who said it (you or the user) and roughly when (e.g. "your second reply"), then quote the relevant lines exactly in a blockquote.
Put the closest matches first; if nothing matches, say so plainly. Do not answer or continue the topic itself.
'''

[brief]
type = 'shortcut'
description = 'Reply in at most 6 sentences.'
prompt = '''
Reply in at most 6 sentences. Lead with the answer and leave out preamble and background the user did not ask for.
'''

[detail]
type = 'shortcut'
description = 'Reply in as much detail as is useful.'
prompt = '''
Reply in full detail: cover the reasoning, steps, examples, edge cases and caveats the user may need.
Before you finish, reflect on what is still missing, such as skipped steps, exceptions, alternatives, or the follow-up questions the user is likely to ask next, and add it.
Stay accurate and do not pad: no filler, no repeating yourself.
'''

[recap]
type = 'shortcut'
description = 'Sum up what this conversation has covered so far.'
prompt = '''
Recap this conversation so far. Go through the topics in the order they came up; for each, give the conclusion or decision reached, or say it is still open.
End with the open questions and the agreed next steps, if there are any.
If the user's message names a topic, recap only that. Keep it concise, and do not add new analysis or continue any topic.
'''

[plan]
type = 'skill'
description = 'Use when the user asks for a change that spans several steps or files.'
prompt = '''
Plan before you write code.

1. Restate the goal in one or two sentences.
2. Ask about anything you cannot infer, such as missing files, constraints, or choices only the user can make. Do not guess.
3. Break the work into small, ordered steps. For each step, name the file and what changes.
4. Briefly note risks and the alternatives you rejected.
5. Stop and wait for the user to agree before giving the full code.

Skip the plan for small, clear fixes.
'''

[compress]
type = 'command'
description = 'Summarize the earlier part of a long conversation so it fits in the context.'
prompt = '''
A long conversation between a user and an AI assistant no longer fits in the assistant's context.
Its earlier part will be replaced by your summary; the recent part stays as it is.

Write the summary for the assistant, who will carry on from it with no other memory of the earlier part. Call the participants "the user" and "you".
Keep whatever the conversation still needs to go on well, keep exact what must be exact, and let the rest go. End where the recent part picks up.
If the earlier part starts with a previous summary, merge it into yours.

Write in the conversation's language. Reply with the summary only.
'''
